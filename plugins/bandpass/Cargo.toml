[package]
name = "orm-bandpass"
description = "ORM BandPass — Rust 重写版 (truce)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
openrm-dsp = { path = "../../crates/openrm-dsp" }
truce = { version = "6.3.0", default-features = false, features = ["clap"] }
openrm-ui = { path = "../../crates/openrm-ui" }
truce-egui = "=6.3.0"
egui = "=0.34.3"
truce-clap = { version = "6.3.0", optional = true }
truce-vst3 = { version = "6.3.0", optional = true }
truce-au = { version = "6.3.0", optional = true }
clap-sys = { version = "0.5", optional = true }
serde_json = "1"
rfd = "0.15"

[features]
default = ["clap", "vst3"]
clap = ["truce/clap", "dep:truce-clap", "dep:clap-sys"]
vst3 = ["truce/vst3", "dep:truce-vst3"]
au = ["dep:truce-au"]

[dev-dependencies]
truce-test = "6.3.0"
png = "0.17"
egui-wgpu = { version = "=0.34.3", default-features = false }
wgpu = { version = "=29.0.4", default-features = false, features = ["wgsl"] }
pollster = "0.4"
