[workspace]
resolver = "2"
members = ["crates/openrm-dsp", "crates/openrm-ui", "plugins/bandpass"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
