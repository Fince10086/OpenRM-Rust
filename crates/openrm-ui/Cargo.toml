[package]
name = "openrm-ui"
description = "OpenRM 共用 egui 主题与自绘控件"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = "=0.34.3"
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
truce-core = "6.3.0"
truce-params = "6.3.0"
wgpu = { version = "=29.0.4", default-features = false, features = ["wgsl"] }
egui-wgpu = { version = "=0.34.3", default-features = false }
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSResponder", "NSColor"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-core-graphics = "0.3.2"
openrm-dsp = { path = "../openrm-dsp" }
